<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Cobertura do gateway e spreading factors LoRa">
<style>
.h{font:600 11px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace;fill:#00e5a0;letter-spacing:2px}
.rl{font:600 9.5px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace;fill:#3d6580}
.sf{font:700 14px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace;fill:#e6f1fb}
.v{font:600 12px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace;fill:#ffd166}

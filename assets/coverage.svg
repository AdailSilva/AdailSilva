.s{font:500 11.5px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace;fill:#7f9bb5}
.sweep{transform-origin:250px 192px;animation:rot 4.0s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.nd{opacity:.25;animation:lit 4.0s linear infinite}
@keyframes lit{0%{opacity:1}25%{opacity:.25}100%{opacity:.25}}
.ping{opacity:0;animation:pg 4.0s ease-out infinite}
@keyframes pg{0%{opacity:.9;transform:scale(1)}20%{opacity:0;transform:scale(5)}100%{opacity:0;transform:scale(5)}}
.grow{animation:gr 7s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes gr{0%{transform:scaleX(0)}25%{transform:scaleX(1)}88%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
.gwc{animation:gp 2s ease-in-out infinite}
@keyframes gp{50%{r:9}}
</style>
